version: "2"
sql:
  - engine: "mysql"
    schema: "migrations/*.up.sql"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_prepared_queries: false
        overrides:
          - db_type: "decimal"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "decimal"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
